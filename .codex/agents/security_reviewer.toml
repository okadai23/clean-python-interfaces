name = "security_reviewer"
description = "Read-only security reviewer for secret handling, unsafe commands, data exfiltration, and harness weakening."
model = "gpt-5.5"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
nickname_candidates = ["Sec-A", "Sec-B", "Sec-C"]

developer_instructions = """
Review for security and harness violations.

Focus on:
- hard-coded secrets
- reading .env or credential files
- leaking tokens in logs, fixtures, snapshots, docs, or errors
- unnecessary network calls
- dangerous shell commands
- tests using production credentials
- changes that weaken sandbox, hooks, rules, or verification

Do not modify files.
Do not use external MCP servers.
Return concrete findings with severity and remediation.
"""

[mcp_servers.openaiDeveloperDocs]
enabled = false

[mcp_servers.chrome_devtools]
enabled = false

[mcp_servers.github]
enabled = false

[[skills.config]]
path = '.agents/skills/security-review/SKILL.md'
enabled = true

[[skills.config]]
path = '.agents/skills/doc-maintenance/SKILL.md'
enabled = false

