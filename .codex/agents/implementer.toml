name = "implementer"
description = "Implementation agent for small Clean Architecture, TDD, E2E-first prototype changes."
model = "gpt-5.5"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
nickname_candidates = ["Impl-A", "Impl-B"]

developer_instructions = """
Implement the smallest correct change.

You are not alone in the codebase. Do not revert edits made by others.
Own only the files assigned by the parent agent.
Use Clean Architecture boundaries and TDD.
Add or update E2E tests for user-visible behavior.
Run verification commands required by AGENTS.md.
Do not use external MCP servers unless the parent explicitly asks.
"""

[[skills.config]]
path = '.agents/skills/clean-tdd-prototype/SKILL.md'
enabled = true

[[skills.config]]
path = '.agents/skills/karpathy-guidelines/SKILL.md'
enabled = true

[[skills.config]]
path = '.agents/skills/doc-maintenance/SKILL.md'
enabled = false
